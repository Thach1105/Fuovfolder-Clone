spring:
  application:
    name: fuoverflow-backend
  profiles:
    default: local
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/fuoverflow}
    username: ${DB_USERNAME:fuoverflow}
    password: ${DB_PASSWORD:fuoverflow}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:15}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      connection-timeout: 3000
      idle-timeout: 600000
      max-lifetime: 1800000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 30s

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  metrics:
    tags:
      application: ${spring.application.name}

fuoverflow:
  coursera:
    refund-on-cancel: true
    credentials:
      encryption-key: ${COURSERA_CREDENTIALS_ENCRYPTION_KEY:local-dev-coursera-key-change-me-32b!}
      key-id: default
  source:
    refund-enabled: ${SOURCE_REFUND_ENABLED:true}
    default-page-size: ${SOURCE_DEFAULT_PAGE_SIZE:24}
    expiry-scan-interval-ms: ${SOURCE_EXPIRY_SCAN_INTERVAL_MS:60000}
  storage:
    uploads-path: ${FUO_UPLOADS_PATH:/data/fuoverflow/uploads}
    logs-path: ${FUO_LOGS_PATH:/data/fuoverflow/logs}
    temp-path: ${FUO_TEMP_PATH:/data/fuoverflow/tmp}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
    allow-credentials: ${CORS_ALLOW_CREDENTIALS:true}
  admin:
    seed:
      enabled: ${FUO_ADMIN_SEED_ENABLED:false}
      email: ${FUO_ADMIN_EMAIL:admin@fuoverflow.local}
      username: ${FUO_ADMIN_USERNAME:fuoverflow-admin}
      password: ${FUO_ADMIN_PASSWORD:}
      display-name: ${FUO_ADMIN_DISPLAY_NAME:FuOverflow Administrator}

auth:
  issuer: ${AUTH_ISSUER:fuoverflow}
  audience: ${AUTH_AUDIENCE:fuoverflow-api}
  access-token-ttl: ${AUTH_ACCESS_TOKEN_TTL:10m}
  refresh-token-ttl: ${AUTH_REFRESH_TOKEN_TTL:30d}
  refresh-token-hash-pepper: ${AUTH_REFRESH_TOKEN_PEPPER:local-dev-refresh-pepper-change-me}
  cookie:
    secure: ${AUTH_COOKIE_SECURE:false}
    same-site: ${AUTH_COOKIE_SAME_SITE:Lax}
    access-name: ${AUTH_ACCESS_COOKIE_NAME:fuoverflow_at}
    refresh-name: ${AUTH_REFRESH_COOKIE_NAME:fuoverflow_rt}
  jwt:
    key-id: ${AUTH_JWT_KEY_ID:local-dev-key-1}
