spring:
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB
  application:
    name: fuoverflow-backend
  profiles:
    default: local
    include: oauth2
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/fuoverflow}
    username: ${DB_USERNAME:fuoverflow}
    password: ${DB_PASSWORD:fuoverflow}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:15}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      connection-timeout: 3000
      idle-timeout: 600000
      max-lifetime: 1800000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 30s

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  metrics:
    tags:
      application: ${spring.application.name}

fuoverflow:
  upload:
    image-max-bytes: 5242880
    document-max-bytes: 20971520
    max-uploads-per-hour: 30
    orphan-cleanup-interval-ms: 3600000
    allowed-image-types:
      - image/png
      - image/jpeg
      - image/webp
      - image/gif
    allowed-document-types:
      - application/pdf
      - application/vnd.openxmlformats-officedocument.wordprocessingml.document
      - application/vnd.openxmlformats-officedocument.presentationml.presentation
  coursera:
    refund-on-cancel: true
    credentials:
      encryption-key: ${COURSERA_CREDENTIALS_ENCRYPTION_KEY:local-dev-coursera-key-change-me-32b!}
      key-id: default
  source:
    refund-enabled: ${SOURCE_REFUND_ENABLED:true}
    default-page-size: ${SOURCE_DEFAULT_PAGE_SIZE:24}
    expiry-scan-interval-ms: ${SOURCE_EXPIRY_SCAN_INTERVAL_MS:60000}
  membership:
    expiry-cron: ${MEMBERSHIP_EXPIRY_CRON:0 0 0 * * *}
  scheduling:
    pool-size: ${FUOVERFLOW_SCHEDULING_POOL_SIZE:4}
    timezone: ${FUOVERFLOW_SCHEDULING_TIMEZONE:Asia/Ho_Chi_Minh}
  worker:
    outbox:
      poll-interval-ms: ${WORKER_OUTBOX_POLL_INTERVAL_MS:30000}
  storage:
    provider: ${STORAGE_PROVIDER:s3}
    uploads-path: ${FUO_UPLOADS_PATH:/data/fuoverflow/uploads}
    logs-path: ${FUO_LOGS_PATH:/data/fuoverflow/logs}
    temp-path: ${FUO_TEMP_PATH:/data/fuoverflow/tmp}
    s3:
      endpoint: ${STORAGE_S3_ENDPOINT:http://localhost:9000}
      region: ${STORAGE_S3_REGION:us-east-1}
      bucket: ${STORAGE_S3_BUCKET:fuoverflow-media}
      access-key: ${STORAGE_S3_ACCESS_KEY:fuoverflow}
      secret-key: ${STORAGE_S3_SECRET_KEY:fuoverflow_minio_dev}
      public-base-url: ${STORAGE_S3_PUBLIC_BASE_URL:http://localhost:9000}
      path-style-access: ${STORAGE_S3_PATH_STYLE:true}
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    auth:
      anonymous-max: 10
      authenticated-max: 10
      window: 15m
    public-endpoints:
      anonymous-max: 60
      authenticated-max: 120
      window: 1m
    api:
      anonymous-max: 30
      authenticated-max: 120
      window: 1m
    global:
      anonymous-max: 30
      authenticated-max: 300
      window: 1m
    block:
      auto-block-duration: 1h
      violations-before-block: 5
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3336,http://localhost:3000}
    allow-credentials: ${CORS_ALLOW_CREDENTIALS:true}
  admin:
    seed:
      enabled: ${FUO_ADMIN_SEED_ENABLED:false}
      email: ${FUO_ADMIN_EMAIL:admin@fuoverflow.local}
      username: ${FUO_ADMIN_USERNAME:fuoverflow-admin}
      password: ${FUO_ADMIN_PASSWORD:}
      display-name: ${FUO_ADMIN_DISPLAY_NAME:Fuexam Administrator}
  notification:
    email:
      enabled: ${NOTIFICATION_EMAIL_ENABLED:true}
      from: ${NOTIFICATION_EMAIL_FROM:${MAIL_FROM:${spring.mail.username:}}}
      subject: ${NOTIFICATION_EMAIL_SUBJECT:Fuexam - Trả lời mới trong chủ đề bạn theo dõi}
      thread-url-base: ${NOTIFICATION_THREAD_URL_BASE:http://localhost:3000/threads}
    push:
      enabled: ${NOTIFICATION_PUSH_ENABLED:false}
      vapid-public-key: ${NOTIFICATION_VAPID_PUBLIC:}
      vapid-private-key: ${NOTIFICATION_VAPID_PRIVATE:}
      subject: ${NOTIFICATION_VAPID_SUBJECT:mailto:admin@fuoverflow.local}

auth:
  issuer: ${AUTH_ISSUER:fuoverflow}
  audience: ${AUTH_AUDIENCE:fuoverflow-api}
  access-token-ttl: ${AUTH_ACCESS_TOKEN_TTL:10m}
  refresh-token-ttl: ${AUTH_REFRESH_TOKEN_TTL:30d}
  max-devices: ${AUTH_MAX_DEVICES:2}
  refresh-token-hash-pepper: ${AUTH_REFRESH_TOKEN_PEPPER:local-dev-refresh-pepper-change-me}
  cookie:
    secure: ${AUTH_COOKIE_SECURE:true}
    same-site: ${AUTH_COOKIE_SAME_SITE:Lax}
    access-name: ${AUTH_ACCESS_COOKIE_NAME:fuoverflow_at}
    refresh-name: ${AUTH_REFRESH_COOKIE_NAME:fuoverflow_rt}
  jwt:
    key-id: ${AUTH_JWT_KEY_ID:local-dev-key-1}
    private-key-location: ${AUTH_JWT_PRIVATE_KEY:classpath:keys/dev-private.pem}
    public-key-location: ${AUTH_JWT_PUBLIC_KEY:classpath:keys/dev-public.pem}
payos:
  client-id: ${PAYOS_CLIENT_ID:}
  api-key: ${PAYOS_API_KEY:}
  checksum-key: ${PAYOS_CHECKSUM_KEY:}

payment:
  link-expiry-minutes: 30

app:
  support:
    email: ${SUPPORT_EMAIL:}
    phone: ${SUPPORT_PHONE:}
