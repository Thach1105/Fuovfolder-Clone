spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/fuoverflow
    username: fuoverflow
    password: fuoverflow
  data:
    redis:
      host: localhost
      port: 6379
      password:
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:thach11052002@gmail.com}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS_ENABLE:true}
          connectiontimeout: ${MAIL_SMTP_CONNECTION_TIMEOUT:10000}
          timeout: ${MAIL_SMTP_TIMEOUT:10000}
          writetimeout: ${MAIL_SMTP_WRITE_TIMEOUT:5000}

fuoverflow:
  rate-limit:
    enabled: false
  admin:
    seed:
      enabled: ${FUO_ADMIN_SEED_ENABLED:true}
      email: ${FUO_ADMIN_EMAIL:admin@fuoverflow.local}
      username: ${FUO_ADMIN_USERNAME:fuoverflow-admin}
      password: ${FUO_ADMIN_PASSWORD:ChangeMe_Admin123!}
      display-name: ${FUO_ADMIN_DISPLAY_NAME:Fuexam Administrator}
  notification:
    email:
      enabled: ${NOTIFICATION_EMAIL_ENABLED:true}
      from: ${MAIL_FROM:${spring.mail.username:}}
      thread-url-base: ${NOTIFICATION_THREAD_URL_BASE:http://localhost:3000/threads}
    push:
      enabled: ${NOTIFICATION_PUSH_ENABLED:false}

auth:
  cookie:
    secure: false
  email-verification:
    enabled: ${AUTH_EMAIL_VERIFICATION_ENABLED:true}
    from: ${MAIL_FROM:${spring.mail.username:}}
    verification-url-base: ${AUTH_EMAIL_VERIFICATION_URL_BASE:http://localhost:3000/verify-email}
    subject: ${AUTH_EMAIL_VERIFICATION_SUBJECT:Verify your Fuexam email}
    code-ttl: ${AUTH_EMAIL_VERIFICATION_CODE_TTL:10m}
    code-length: ${AUTH_EMAIL_VERIFICATION_CODE_LENGTH:6}
    max-attempts: ${AUTH_EMAIL_VERIFICATION_MAX_ATTEMPTS:5}
  password-reset:
    enabled: ${AUTH_PASSWORD_RESET_ENABLED:true}
    from: ${MAIL_FROM:${spring.mail.username:}}
    reset-url-base: ${AUTH_PASSWORD_RESET_URL_BASE:http://localhost:3000/reset-password}
    subject: ${AUTH_PASSWORD_RESET_SUBJECT:Reset your Fuexam password}
    token-ttl: ${AUTH_PASSWORD_RESET_TOKEN_TTL:1h}

logging:
  level:
    com.fuoverflow: INFO
    org.hibernate.SQL: WARN
