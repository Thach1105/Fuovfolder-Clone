services:
  postgres:
    image: postgres:16-alpine
    container_name: fuoverflow-postgres
    environment:
      POSTGRES_DB: fuoverflow
      POSTGRES_USER: fuoverflow
      POSTGRES_PASSWORD: fuoverflow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fuoverflow -d fuoverflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: fuoverflow-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: fuoverflow-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: fuoverflow
      MINIO_ROOT_PASSWORD: fuoverflow_minio_dev
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  minio-init:
    image: minio/mc:latest
    container_name: fuoverflow-minio-init
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 fuoverflow fuoverflow_minio_dev; do sleep 1; done;
      mc mb --ignore-existing local/fuoverflow-media;
      mc anonymous set download local/fuoverflow-media;
      exit 0;
      "

volumes:
  postgres_data:
  redis_data:
  minio_data:
