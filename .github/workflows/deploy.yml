name: Deploy-FuOverflow

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: fuoverflow-deploy
  cancel-in-progress: true

env:
  ENV_FILE: /opt/fuoverflow/.env
  COMPOSE_FILE: deploy/docker-compose.yml
  BACKEND_PORT: "18080"
  FUEXAM_PORT: "3336"
  FUEXAM_ADMIN_PORT: "4446"

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify production env file
        run: |
          if [ ! -f "${{ env.ENV_FILE }}" ]; then
            echo "::error::Missing ${{ env.ENV_FILE }}. Copy .env.example and configure secrets on the server."
            exit 1
          fi
          set -a
          # shellcheck disable=SC1090
          . "${{ env.ENV_FILE }}"
          set +a
          if [ "${BACKEND_PUBLISH_PORT:-18080}" != "${{ env.BACKEND_PORT }}" ] || \
             [ "${FUEXAM_PUBLISH_PORT:-3336}" != "${{ env.FUEXAM_PORT }}" ] || \
             [ "${FUEXAM_ADMIN_PUBLISH_PORT:-4446}" != "${{ env.FUEXAM_ADMIN_PORT }}" ]; then
            echo "::error::Expected BACKEND_PUBLISH_PORT=${{ env.BACKEND_PORT }}, FUEXAM_PUBLISH_PORT=${{ env.FUEXAM_PORT }}, FUEXAM_ADMIN_PUBLISH_PORT=${{ env.FUEXAM_ADMIN_PORT }} in ${{ env.ENV_FILE }}."
            exit 1
          fi
          if [ -z "${FUEXAM_ADMIN_BACKEND_ORIGIN:-}" ]; then
            echo "::error::FUEXAM_ADMIN_BACKEND_ORIGIN is required in ${{ env.ENV_FILE }} (e.g. https://api-fuexam.fuexam.com)."
            exit 1
          fi

      - name: Verify Flyway migration versions
        run: |
          versions="$(find backend/app/src/main/resources/db/migration -maxdepth 1 -type f -name 'V*__*.sql' -printf '%f\n' | sed -E 's/^V([0-9]+)__.*/\1/' | sort)"
          duplicates="$(printf '%s\n' "$versions" | uniq -d)"
          if [ -n "$duplicates" ]; then
            echo "::error::Duplicate Flyway migration version(s): $duplicates"
            find backend/app/src/main/resources/db/migration -maxdepth 1 -type f -name 'V*__*.sql' -printf '%f\n' | sort -V
            exit 1
          fi

      - name: Stop legacy systemd services
        run: |
          for svc in fuoverflow-backend; do
            if systemctl is-active --quiet "$svc" 2>/dev/null; then
              if sudo -n systemctl stop "$svc" 2>/dev/null; then
                echo "Stopped systemd service $svc."
              else
                echo "::warning::Could not stop $svc (grant passwordless sudo or stop manually)."
              fi
            fi
            if sudo -n systemctl disable "$svc" 2>/dev/null; then
              echo "Disabled systemd service $svc."
            fi
          done

      - name: Prepare persistent data directories
        run: |
          # Runner often has Docker access but not passwordless sudo.
          docker run --rm -v /opt/fuoverflow/data:/data alpine:3.20 \
            sh -c 'mkdir -p /data/uploads /data/logs /data/tmp && chmod -R 777 /data/uploads /data/logs /data/tmp'

      - name: Build and start Docker stack
        working-directory: ${{ github.workspace }}
        run: |
          compose=(docker compose -f "${{ env.COMPOSE_FILE }}" --env-file "${{ env.ENV_FILE }}")
          "${compose[@]}" build --pull backend fuexam fuexam_admin
          "${compose[@]}" up -d --remove-orphans --force-recreate

      - name: Health check
        run: |
          backend_ok=0
          fuexam_ok=0
          admin_ok=0
          for attempt in $(seq 1 24); do
            if [ "$backend_ok" -eq 0 ] && curl -fsS "http://localhost:${{ env.BACKEND_PORT }}/actuator/health/liveness" >/dev/null; then
              backend_ok=1
              echo "Backend health OK on port ${{ env.BACKEND_PORT }}."
            fi
            fuexam_code="$(curl -sS -o /dev/null -w '%{http_code}' "http://localhost:${{ env.FUEXAM_PORT }}" 2>/dev/null || echo 000)"
            if [ "$fuexam_ok" -eq 0 ] && echo "$fuexam_code" | grep -qE '^(200|307|308)$'; then
              fuexam_ok=1
              echo "Fuexam health OK on port ${{ env.FUEXAM_PORT }} (HTTP $fuexam_code)."
            fi
            admin_code="$(curl -sS -o /dev/null -w '%{http_code}' "http://localhost:${{ env.FUEXAM_ADMIN_PORT }}" 2>/dev/null || echo 000)"
            if [ "$admin_ok" -eq 0 ] && echo "$admin_code" | grep -qE '^(200|307|308)$'; then
              admin_ok=1
              echo "Fuexam admin health OK on port ${{ env.FUEXAM_ADMIN_PORT }} (HTTP $admin_code)."
            fi
            if [ "$backend_ok" -eq 1 ] && [ "$fuexam_ok" -eq 1 ] && [ "$admin_ok" -eq 1 ]; then
              exit 0
            fi
            sleep 5
          done
          echo "::error::Deploy health check failed after 120s."
          docker compose -f "${{ env.COMPOSE_FILE }}" --env-file "${{ env.ENV_FILE }}" ps
          docker compose -f "${{ env.COMPOSE_FILE }}" --env-file "${{ env.ENV_FILE }}" logs backend --tail 80 || true
          docker compose -f "${{ env.COMPOSE_FILE }}" --env-file "${{ env.ENV_FILE }}" logs fuexam --tail 80 || true
          docker compose -f "${{ env.COMPOSE_FILE }}" --env-file "${{ env.ENV_FILE }}" logs fuexam_admin --tail 80 || true
          exit 1
