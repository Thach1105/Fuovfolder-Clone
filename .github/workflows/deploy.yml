name: Deploy-FuOverflow

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: fuoverflow-deploy
  cancel-in-progress: true

env:
  ENV_FILE: /opt/fuoverflow/.env
  COMPOSE_FILE: deploy/docker-compose.yml
  BACKEND_PORT: "18080"
  FRONTEND_PORT: "19080"

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify production env file
        run: |
          if [ ! -f "${{ env.ENV_FILE }}" ]; then
            echo "::error::Missing ${{ env.ENV_FILE }}. Copy .env.example and configure secrets on the server."
            exit 1
          fi
          set -a
          # shellcheck disable=SC1090
          . "${{ env.ENV_FILE }}"
          set +a
          if [ "${BACKEND_PUBLISH_PORT:-18080}" != "${{ env.BACKEND_PORT }}" ] || [ "${FRONTEND_PUBLISH_PORT:-19080}" != "${{ env.FRONTEND_PORT }}" ]; then
            echo "::error::Expected BACKEND_PUBLISH_PORT=${{ env.BACKEND_PORT }} and FRONTEND_PUBLISH_PORT=${{ env.FRONTEND_PORT }} in ${{ env.ENV_FILE }}."
            exit 1
          fi

      - name: Stop legacy systemd services
        run: |
          for svc in fuoverflow-backend fuoverflow-frontend; do
            if systemctl is-active --quiet "$svc" 2>/dev/null; then
              if sudo -n systemctl stop "$svc" 2>/dev/null; then
                echo "Stopped systemd service $svc."
              else
                echo "::warning::Could not stop $svc (grant passwordless sudo or stop manually)."
              fi
            fi
            if sudo -n systemctl disable "$svc" 2>/dev/null; then
              echo "Disabled systemd service $svc."
            fi
          done

      - name: Prepare persistent data directories
        run: |
          # Runner often has Docker access but not passwordless sudo.
          docker run --rm -v /opt/fuoverflow/data:/data alpine:3.20 \
            sh -c 'mkdir -p /data/uploads /data/logs /data/tmp && chmod -R 777 /data/uploads /data/logs /data/tmp'

      - name: Build and start Docker stack
        working-directory: ${{ github.workspace }}
        run: |
          compose=(docker compose -f "${{ env.COMPOSE_FILE }}" --env-file "${{ env.ENV_FILE }}")
          "${compose[@]}" build --pull backend frontend
          "${compose[@]}" up -d --remove-orphans --force-recreate

      - name: Health check
        run: |
          backend_ok=0
          frontend_ok=0
          for attempt in $(seq 1 24); do
            if [ "$backend_ok" -eq 0 ] && curl -fsS "http://localhost:${{ env.BACKEND_PORT }}/actuator/health/liveness" >/dev/null; then
              backend_ok=1
              echo "Backend health OK on port ${{ env.BACKEND_PORT }}."
            fi
            http_code="$(curl -fsS -o /dev/null -w '%{http_code}' "http://localhost:${{ env.FRONTEND_PORT }}" 2>/dev/null || echo 000)"
            if [ "$frontend_ok" -eq 0 ] && echo "$http_code" | grep -qE '^200|307|308$'; then
              frontend_ok=1
              echo "Frontend health OK on port ${{ env.FRONTEND_PORT }} (HTTP $http_code)."
            fi
            if [ "$backend_ok" -eq 1 ] && [ "$frontend_ok" -eq 1 ]; then
              exit 0
            fi
            sleep 5
          done
          echo "::error::Deploy health check failed after 120s."
          docker compose -f "${{ env.COMPOSE_FILE }}" --env-file "${{ env.ENV_FILE }}" ps
          docker compose -f "${{ env.COMPOSE_FILE }}" --env-file "${{ env.ENV_FILE }}" logs backend --tail 80 || true
          docker compose -f "${{ env.COMPOSE_FILE }}" --env-file "${{ env.ENV_FILE }}" logs frontend --tail 80 || true
          exit 1
