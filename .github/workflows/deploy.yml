name: Deploy-FuOverflow

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  ENV_FILE: /opt/fuoverflow/.env
  COMPOSE_FILE: deploy/docker-compose.yml
  BACKEND_PORT: "18080"
  FRONTEND_PORT: "19080"

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify production env file
        run: |
          if [ ! -f "${{ env.ENV_FILE }}" ]; then
            echo "::error::Missing ${{ env.ENV_FILE }}. Copy .env.example and configure secrets on the server."
            exit 1
          fi

      - name: Stop legacy systemd services
        run: |
          for svc in fuoverflow-backend fuoverflow-frontend; do
            if systemctl is-active --quiet "$svc" 2>/dev/null; then
              if sudo -n systemctl stop "$svc" 2>/dev/null; then
                echo "Stopped systemd service $svc."
              else
                echo "::warning::Could not stop $svc (grant passwordless sudo or stop manually)."
              fi
            fi
          done

      - name: Build and start Docker stack
        run: |
          docker compose -f "${{ env.COMPOSE_FILE }}" --env-file "${{ env.ENV_FILE }}" build
          docker compose -f "${{ env.COMPOSE_FILE }}" --env-file "${{ env.ENV_FILE }}" up -d --remove-orphans

      - name: Health check
        if: success()
        run: |
          sleep 10
          if curl -fsS "http://localhost:${{ env.BACKEND_PORT }}/actuator/health"; then
            echo "Backend health OK."
          else
            echo "::warning::Backend not responding on port ${{ env.BACKEND_PORT }}. Run: docker compose -f ${{ env.COMPOSE_FILE }} --env-file ${{ env.ENV_FILE }} logs backend --tail 80"
          fi
          http_code="$(curl -fsS -o /dev/null -w '%{http_code}' "http://localhost:${{ env.FRONTEND_PORT }}" || echo 000)"
          if echo "$http_code" | grep -qE '^200|307|308$'; then
            echo "Frontend health OK."
          else
            echo "::warning::Frontend not responding on port ${{ env.FRONTEND_PORT }} (HTTP $http_code). Run: docker compose -f ${{ env.COMPOSE_FILE }} --env-file ${{ env.ENV_FILE }} logs frontend --tail 80"
          fi
